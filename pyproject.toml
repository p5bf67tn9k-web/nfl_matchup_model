[project]
name = "nfl_matchup_model"
version = "0.0.0"
description = "Independent, auditable NFL matchup strength & performance model"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.44",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires network access to nflverse data",
    "slow: slow test (walk-forward / validation)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# one-off Phase 0 audit scripts: not production code
"scripts/phase0_*.py" = ["DTZ005", "DTZ011", "PIE810"]
